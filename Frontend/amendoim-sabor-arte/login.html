<!DOCTYPE html> <!-- utiliza do HTML5 -->
<html lang="pt-BR"> <!-- configuração do idioma -->

<head> <!-- abertura da configuração interna do site -->
    <meta charset="UTF-8"> <!-- ativa os caracteres em português -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- configuração de visualização para dispositivos móveis -->
    <title>Login - Amendoim Sabor Arte</title> <!-- título da página -->
    <!-- Importação das fontes idêntica à página principal -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/><!-- importação das fontes do Google Fonts -->
    
    <style>
        :root { /* Definição das variáveis de cor */
            --caramel-dark: #8b4513;
            --caramel: #d2691e;
            --caramel-light: #f4a460;
            --gold: #ffd700;
            --red: #c41e3a;
            --cream: #fff8dc;
            --white: #ffffff;
            --gray-dark: #333333;
            --gray: #666666;
            --gray-light: #f5f5f5;
            --font-display: "Playfair Display", serif;
            --font-body: "Inter", sans-serif;
        }

        * { /* Estilo universal */
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body { /* Estilos para o corpo da página */
            font-family: var(--font-body);
            /* Fundo com degradê suave usando as cores da marca */
            background: linear-gradient(135deg, var(--cream) 0%, #e9dcc9 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Container do Login (Card) */
        .login-container {
            background-color: var(--white);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 5px solid var(--caramel); /* Detalhe superior */
        }

        .logo-login { /* Estilos para o logo do login */
            font-family: var(--font-display);
            font-size: 1.8rem;
            color: var(--caramel-dark);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle { /* Estilos para o subtítulo */
            color: var(--gray); /* Cor do texto */
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .form-group { /* Estilos para o grupo de formulário */
            text-align: left;
            margin-bottom: 20px;
        }

        label { /* Estilos para as labels */
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--gray-dark);
            margin-bottom: 5px;
        }

        input { /* Estilos para os campos de input */
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 1rem;
            transition: border-color 0.3s ease;
            outline: none;
        }

        input:focus { /* Estilos para o campo de input quando focado */
            border-color: var(--caramel);
            box-shadow: 0 0 0 2px rgba(210, 105, 30, 0.1);
        }

        /* Botão estilizado como o CTA da landing page */
        .btn-login {
            width: 100%;
            background-color: var(--caramel);
            color: var(--white);
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: var(--caramel-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 69, 19, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        #error-message {
            color: var(--red);
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
            background-color: #ffebee;
            padding: 10px;
            border-radius: 5px;
        }

        .back-to-site {
            display: inline-block;
            margin-top: 25px;
            color: var(--caramel);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .back-to-site:hover {
            color: var(--caramel-dark);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-login">Amendoim Sabor Arte</div>
        <p class="subtitle">Acesse sua conta para gerenciar pedidos</p>

        <form id="login-form">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="exemplo@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Entrar</button>
            
            <p id="error-message">E-mail ou senha incorretos. Tente novamente.</p>
        </form>

        <a href="index.html" class="back-to-site">← Voltar para o início</a>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Simulação simples de login
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (email === "admin@saborarte.com" && password === "123456") {
                alert("Login realizado com sucesso!");
                window.location.href = "index.html"; // Redireciona
            } else {
                errorMessage.style.display = "block";
                // Animação de balanço para erro
                form.style.animation = "shake 0.5s";
                setTimeout(() => form.style.animation = "", 500);
            }
        });
    </script>

    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>

</body>
</html>
