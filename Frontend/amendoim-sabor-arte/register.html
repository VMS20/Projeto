<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Amendoim Sabor Arte</title>
    <!-- Mesmas fontes da marca -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="account.css">
</head>
<body>
    <header class="account-header"><a href="index.html" class="account-brand">Amendoim Sabor Arte</a><a href="index.html" class="back-to-site">Voltar ao site</a></header>
    <main class="account-shell">
      <aside class="account-story"><div><h2>O sabor que aproxima.</h2><p>Amendoim caramelizado artesanal para acompanhar seus bons momentos.</p></div><figure class="account-product"><img src="amendoim-caramelizado.png" alt="Amendoim caramelizado em uma tigela de cerâmica" width="1122" height="1402"><figcaption>Imagem ilustrativa do produto.</figcaption></figure></aside>

    <div class="register-container">
        <h1 class="account-title">Crie sua conta.</h1>
        <p class="subtitle">Crie sua conta para fazer pedidos. É simples e rápido.</p>

        <form id="register-form">
            <div class="form-grid">
                <div class="form-group field-wide">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" autocomplete="name" minlength="2" maxlength="100" placeholder="Seu nome" required>
                </div>

                <div class="form-group field-wide">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" autocomplete="email" maxlength="254" placeholder="seu@email.com" required>
                </div>

                <div class="form-group field-wide">
                    <label for="tel">Telefone / WhatsApp</label>
                    <input type="tel" id="tel" autocomplete="tel" maxlength="20" placeholder="(00) 00000-0000" required>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" minlength="6" maxlength="128" autocomplete="new-password" placeholder="Mínimo 6 caracteres" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmar Senha</label>
                    <input type="password" id="confirm-password" autocomplete="new-password" minlength="6" maxlength="128" placeholder="Repita a senha" required>
                </div>
            </div>

            <div class="terms-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">Eu aceito os termos de uso e política de privacidade.</label>
            </div>

            <button type="submit" class="btn-register">Criar minha conta</button>

            <p role="alert" id="error-message"></p>
        </form>

        <div class="footer-links">
            <p>Já possui uma conta? <a href="login.html">Entre aqui</a></p>
        </div>
    </div>

    </main>
    <footer class="account-footer">Amendoim Sabor Arte · O sabor que aproxima.</footer>
    <script src="auth.js" defer></script>
</body>
</html>
